#!/bin/sh
# Fix  for dell latitude
# Не подключались bluetooth
# Отавливался проводной интернет
# Точпад переставал реагировать на один палец.

if [ "$1" = "post" ]; then
        logger "restart bluetooth service"
        systemctl restart bluetooth.service
fi
case "$1" in
    pre)
        logger "try unload module r8169"
        modprobe -r r8169
        
        logger "try unload module i2c_hid_acpi i2c_hid hid_multitouch"
        modprobe -r i2c_hid_acpi i2c_hid hid_multitouch
        ;;
    post)
        logger "try load module r8169"
        modprobe r8169

        logger "try load module i2c_hid_acpi"
        modprobe i2c_hid_acpi

        ;;
esac

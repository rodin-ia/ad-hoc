#!/bin/sh
# fix for ASUS Vivobook S 14 M5406WA_M5406WA
# Тачпад после сна/гибернации мог скролить только двумя пальцами.
# Wifi дурил.

if [ "$1" = "post" ]; then
    logger "try unload  WiFi module"
    /usr/sbin/modprobe -r mt7921e

    logger "try unload touchpad module"
    /usr/sbin/modprobe -r i2c_hid_acpi i2c_hid
    sleep 1

    logger "try load  WiFi module"
    /usr/sbin/modprobe mt7921e

    logger "try unload touchpad module"
    /usr/sbin/modprobe i2c_hid_acpi
fi
